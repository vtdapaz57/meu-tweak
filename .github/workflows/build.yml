name: Build Tweak
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          echo "TARGET=iphone:clang:14.5:12.0" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          git clone https://github.com/ProcursusTeam/ldid.git
          cd ldid
          git submodule update --init
          make
          sudo make install

      - name: Compile Tweak
        id: compile
        continue-on-error: true
        run: |
          export THEOS=$HOME/theos
          export TARGET=iphone:clang:14.5:12.0
          make 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "COMPILE_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Show build log if failed
        if: env.COMPILE_FAILED == 'true'
        run: |
          echo "===== BUILD LOG ====="
          cat build.log
          echo "===================="

      - name: Upload dylib if success
        if: env.COMPILE_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tweak_output
          path: ./*.dylib
