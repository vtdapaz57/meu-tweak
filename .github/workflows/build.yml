name: Build Tweak
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Show files
        run: |
          ls -la
          cat Makefile
          head -20 Tweak.xm

      - name: Compile with full output
        run: |
          export THEOS=$HOME/theos
          export TARGET=iphone:clang:14.5:12.0
          export SDKVERSION=14.5
          make clean
          make 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Upload error log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error_log
          path: /tmp/build.log

      - name: Upload dylib if success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tweak_output
          path: ./*.dylib
